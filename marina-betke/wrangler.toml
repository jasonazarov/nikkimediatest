# ---------------------------------------------------------------------------
# Marina Betke: Website + Lead-CRM
#
# Eigenständiger Worker, NICHT nikki-media. Er hat einen eigenen Namen und eine
# eigene Datenbank und berührt nikkimedia.co nicht.
#
#   public/            alle Seiten, Bilder, Schriften (statisch, vor dem Worker)
#   /terminbuchung/    rendert der Worker (Stepper, src/views/stepper.ts)
#   /api/leads         speichert eine Anfrage im CRM
#   /admin             das CRM (Passwort aus dem Secret ADMIN_PASSWORD)
# ---------------------------------------------------------------------------
name = "marina-betke"
main = "src/index.ts"
compatibility_date = "2025-11-01"
account_id = "c80a29b391c87cab55592199b80c7663"

# Bis eine eigene Domain hängt, ist der Worker unter
# marina-betke.<account>.workers.dev erreichbar. Mit Domain auf false stellen.
workers_dev = true
preview_urls = false

# Die Vorlage der Terminseite wird als Text in den Worker gebündelt.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# D1: die CRM-Datenbank
# Anlegen:   npx wrangler d1 create marina-betke-crm
# Dann die ausgegebene database_id hier eintragen und die Tabellen anlegen:
#            npx wrangler d1 migrations apply marina-betke-crm --remote
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "marina-betke-crm"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Eigene Domain (wenn es so weit ist):
# [[routes]]
# pattern = "marinabetke.de"
# custom_domain = true
#
# Secrets (nie in eine Datei im Repo):
#   npx wrangler secret put ADMIN_PASSWORD   Pflicht: Login ins CRM
#   npx wrangler secret put IP_SALT          empfohlen: beliebige Zufallszeichen
#   npx wrangler secret put RESEND_API_KEY   optional: Mail bei neuer Anfrage
# Variablen für die Mail (optional, nur mit RESEND_API_KEY):
[vars]
ADMIN_EMAIL = ""
MAIL_FROM = ""
# ---------------------------------------------------------------------------
